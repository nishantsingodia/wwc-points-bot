name: On-Demand Live Refresh

# Fired by the draft app's "Refresh live points" button (workflow_dispatch via a
# fine-grained PAT). Runs the LIGHT path — like the 5-min live tick (cached series_info,
# no review write-back) — but SKIPS the toss-window gate, because a human is explicitly
# asking mid-innings. Every feed is keyless and unmetered (ESPN + Cricbuzz + cricsheet), so a
# tap costs no quota — the app's cooldown is now only about not hammering ESPN/Cricbuzz.
# RESTORES the cricsheet cache (seeded by the 2-hourly full run) so it does NOT downgrade
# cricsheet-resolved completed matches to LIVE — restore-only, so it never saves an empty
# dir that could poison the cache.
on:
  workflow_dispatch:

# The refresh now COMMITS the decisions it consumed (recon picks, filled cricinfo ids), so it
# needs write access — previously it only ever read/wrote the sheet.
permissions:
  contents: write

# Don't let taps pile up — one refresh at a time (the app also rejects a tap while running).
concurrency:
  group: on-demand-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Share the keyless feed cache (WC_CACHE_DIR: ESPN + Cricbuzz responses) with the
      # other workflows.
      - name: Restore feed cache (ESPN + Cricbuzz)
        uses: actions/cache@v4
        with:
          path: api_cache
          key: wc-apicache-${{ github.run_id }}
          restore-keys: wc-apicache-

      # Restore-only: use the cricsheet the full run cached (keeps completed matches
      # COMPLETED). Never saves — a light run has no fresh cricsheet to contribute.
      - name: Restore cricsheet cache
        uses: actions/cache/restore@v4
        with:
          path: cricsheet
          key: wc-cricsheet-${{ github.run_id }}
          restore-keys: wc-cricsheet-

      - name: On-demand live refresh (light, no toss gate)
        env:
          FREQUENT: "1"
          ON_DEMAND: "1"
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRICSHEET_DIR: cricsheet
          WC_CACHE_DIR: api_cache
        run: python wc_fps_to_csv.py

      # The Refresh button is a DECISION-CONSUMING run: it reads your Recon Review picks and any
      # cricinfo ids you filled into "Needs Cricinfo ID". Without this step those writes died with
      # the runner, so pressing Refresh appeared to work (the sheet updated) while the ledgers that
      # make the decision STICK were silently thrown away.
      - name: Persist sheet decisions to git
        if: always()
        run: |
          # registry/cricbuzz_match_map.json is the cricbuzz<->our-match PIN. It is DERIVED, but it
          # must be committed or it is written-but-never-read: every run would re-derive the
          # pairing from team names, which is exactly the state in which a rename upstream can
          # silently re-pair or un-pair an already-SETTLED match.
          # registry/cricbuzz_bridge.json is the cricbuzz_id -> cricinfo_id IDENTITY bridge, and it
          # was MISSING from this list: every adoption the run made died with the runner, so the
          # bridge could never accumulate. Now that Cricbuzz is the only second witness, it persists.
          LEDGERS="registry/recon_overrides.json registry/new_players.json registry/identity_splits.json registry/frozen_tours.json registry/settlement_snapshots.json registry/completed_matches.json registry/cricsheet_learned_aliases.json registry/manual_ci_bridges.json registry/cricbuzz_match_map.json registry/cricbuzz_bridge.json registry/identity_changes.json"
          if [ -n "$(git status --porcelain $LEDGERS)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in $LEDGERS; do [ -f "$f" ] && git add "$f"; done
            git commit -m "chore: persist on-demand sheet decisions [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Persisted on-demand decisions."
          else
            echo "Nothing to persist."
          fi
