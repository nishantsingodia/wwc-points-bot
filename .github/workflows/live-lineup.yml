name: Live Lineup (toss XI)

# Every 5 min, but the script exits immediately unless a match is in its toss
# window ([toss-30m, start+15m]) per committed toss_windows.json — so idle ticks
# do no work at all. In-window, it does a normal run (ESPN posts the announced XI).
# Every feed is keyless and unmetered (ESPN + Cricbuzz + cricsheet), so there is no
# daily cap to ration; the tick still prefers cached immutable payloads (TICK_CACHE_ONLY)
# out of politeness/latency, not budget. The 4-hourly full run (wwc-points.yml) is
# unchanged and still owns points.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# Don't pile up ticks if one run is slow.
# The tick runs the FULL run_tour once past the toss gate, so it can be the run that first
# publishes a match COMPLETED — which FREEZES its write-once settlement baseline. Without a
# commit step that baseline died with the runner, and the next full run (up to 4h later, after
# ESPN backfills) froze the POST-backfill number instead. /audit then reports delta 0 and the
# pre-settle checklist passes, asserting "provably unchanged" for a number that did change.
# The documented size of that provisional->backfill swing is Gleeson 4 -> 145 FP.
permissions:
  contents: write

concurrency:
  group: live-lineup
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Share the keyless feed cache (WC_CACHE_DIR: ESPN + Cricbuzz responses) with the
      # main workflow — this is what TICK_CACHE_ONLY serves final scorecards out of.
      - name: Restore feed cache (ESPN + Cricbuzz)
        uses: actions/cache@v4
        with:
          path: api_cache
          key: wc-apicache-${{ github.run_id }}
          restore-keys: wc-apicache-

      # Restore-only: the full run's cricsheet, so a toss-window tick doesn't downgrade
      # cricsheet-resolved completed matches (unresolved L1 gap) from COMPLETED to LIVE.
      - name: Restore cricsheet cache
        uses: actions/cache/restore@v4
        with:
          path: cricsheet
          key: wc-cricsheet-${{ github.run_id }}
          restore-keys: wc-cricsheet-

      - name: Live lineup tick (ESPN announced XI, toss-window only)
        env:
          FREQUENT: "1"
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRICSHEET_DIR: cricsheet
          WC_CACHE_DIR: api_cache
        run: python wc_fps_to_csv.py

      - name: Persist sheet decisions to git
        if: always()
        run: |
          # registry/cricbuzz_match_map.json is the cricbuzz<->our-match PIN. It is DERIVED, but it
          # must be committed or it is written-but-never-read: every run would re-derive the
          # pairing from team names, which is exactly the state in which a rename upstream can
          # silently re-pair or un-pair an already-SETTLED match.
          # registry/cricbuzz_bridge.json is the cricbuzz_id -> cricinfo_id IDENTITY bridge, and it
          # was MISSING from this list: every adoption the run made died with the runner, so the
          # bridge could never accumulate. Now that Cricbuzz is the only second witness, it persists.
          LEDGERS="registry/recon_overrides.json registry/new_players.json registry/identity_splits.json registry/frozen_tours.json registry/settlement_snapshots.json registry/completed_matches.json registry/cricsheet_learned_aliases.json registry/manual_ci_bridges.json registry/cricbuzz_match_map.json registry/cricbuzz_bridge.json registry/identity_changes.json"
          if [ -n "$(git status --porcelain $LEDGERS)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in $LEDGERS; do [ -f "$f" ] && git add "$f"; done
            git commit -m "chore: persist live-tick sheet decisions [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Persisted live-tick decisions."
          else
            echo "Nothing to persist."
          fi
